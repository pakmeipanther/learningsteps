apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: learningsteps-kv-provider
  namespace: default
spec:
  provider: azure
  # ========================================================================
  # SECURE REFACTOR: Correcting Managed Identity Binding Parameters
  # ========================================================================
  parameters:
    useVMManagedIdentity: "true" # ◄ SUCCESS VALUE: Corrected key spelling
    userAssignedIdentityID: "a2594441-f395-4ecb-af23-db529d7281b1" # Inject Client ID here
    keyvaultName: "learningsteps-kv-hpkl4f"
    cloudName: ""
    objects:  |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""
    tenantId: "e6744405-892d-4ea5-987a-cfe11463a4dc"
  # Automatically syncs the mounted vault secret into a standard Kubernetes Secret token mapping
  secretObjects:
  - secretName: learningsteps-app-secret
    type: Opaque
    data:
    - objectName: db-password
      key: DB_PASSWORD