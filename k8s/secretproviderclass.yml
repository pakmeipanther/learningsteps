apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: learningsteps-kv-provider
  namespace: default
spec:
  provider: azure
  # ========================================================================
  # SUCCESS CONFIGURATION: Locked Casing Key Structure
  # ========================================================================
  parameters:
    useVMManagedIdentity: "true"                      # ◄ Explicitly utilize Azure Managed Identity
    userAssignedIdentityID: "8c969a91-efb3-4a1f-a100-e6262d4608e1" # ◄ Capital ID structure
    keyvaultName: "learningsteps-kv-76fgv4"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""
    tenantId: "e6744405-892d-4ea5-987a-cfe11463a4dc"
  # Automatically syncs the mounted vault secret into a standard Kubernetes Secret token mapping
  secretObjects:
  - secretName: learningsteps-app-secret
    type: Opaque
    data:
    - objectName: db-password
      key: DB_PASSWORD