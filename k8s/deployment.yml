apiVersion: apps/v1
kind: Deployment
metadata:
  name: learningsteps-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learningsteps-app
  template:
    metadata:
      labels:
        app: learningsteps-app
    spec: 
      containers: 
      - name: app-container
        image: learningstepsreg01.azurecr.io/learningsteps-app:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: learningsteps-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: learningsteps-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: learningsteps-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: learningsteps-config
              key: DB_USER
        # SUCCESS VALUE: Injects the password dynamically from the CSI synchronized secret token
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learningsteps-app-secret
              key: DB_PASSWORD
              
        # Secure volume mounting path for runtime file injection
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true

      # Registers the Secrets Store CSI Driver volume tracking lifecycle
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "learningsteps-kv-provider"