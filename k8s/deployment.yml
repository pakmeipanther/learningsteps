apiVersion: apps/v1
kind: Deployment
metadata:
  name: learningsteps-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learningsteps-app
  template:
    metadata:
      labels:
        app: learningsteps-app
    spec: 
      containers: 
      - name: app-container
        image: learningstepsreg01.azurecr.io/learningsteps-app:latest
        ports:
        - containerPort: 80
        env: 
        - name: DATABASE_URL
          value: "postgresql://postgresuser@learningsteps-db-server-hpkl4f:YourSecurePassword@learningsteps-db-server-hpkl4f.postgres.database.azure.com:5432/postgres"